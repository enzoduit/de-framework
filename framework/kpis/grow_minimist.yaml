de: grow_minimist
kpis:
  - id: soav_score
    name: SoAV Score (Perplexity)
    target: 30
    unit: "%"
    direction: up
    measure: "python3 workspace/measure_soav.py 2>/dev/null || echo 'not_measured'"
    frequency: weekly

  - id: lead_count
    name: Leads (charity retail directors)
    target: 3
    unit: leads
    direction: up
    measure: "python3 -c \"import json,os; d=json.load(open('workspace/leads.json')) if os.path.exists('workspace/leads.json') else {}; print(len(d.get('leads',[])))\" 2>/dev/null || echo 0"
    frequency: daily
